const MAX_COUNTRIES = 4;


/* =========================================================
   BUILD COUNTRY UI
   ========================================================= */

const listEl =
  document.getElementById("country-list");

Object.keys(countryStyle).forEach((code, i) => {

  const label = document.createElement("label");

  label.className = "country-item";

  label.innerHTML =
    '<span>' +
    '<input type="checkbox" value="' +
    code +
    '" class="country-cb"' +
    (i === 0 ? " checked" : "") +
    " />" +
    countryLabels[code] +
    "</span>" +
    '<span class="rpm-tag">' +
    countryStyle[code].rpm +
    "</span>";

  listEl.appendChild(label);

});


/* =========================================================
   COUNTRY LIMIT
   ========================================================= */

function refreshCbLimits() {

  const checked =
    document.querySelectorAll(
      ".country-cb:checked"
    );

  document
    .querySelectorAll(".country-cb")
    .forEach(box => {

      box.disabled =
        checked.length >= MAX_COUNTRIES &&
        !box.checked;

    });

}


document
  .querySelectorAll(".country-cb")
  .forEach(cb => {

    cb.addEventListener("change", () => {

      refreshCbLimits();

      document.getElementById(
        "error"
      ).style.display = "none";

    });

  });


refreshCbLimits();


/* =========================================================
   TOPIC PICKER
   ========================================================= */

function pickTopic(topic) {

  document.getElementById("topic").value =
    topic;

  document.getElementById("error")
    .style.display = "none";

}


/* =========================================================
   COUNTRY PROMPT BLOCK
   ========================================================= */

function buildCountryBlock(countries) {

  return countries.map(code => {

    const c =
      countryStyle[code];

    return (

      countryLabels[code] +
      " (RPM: " +
      c.rpm +
      "):\n" +

      "- Aesthetic: " +
      c.aesthetic +
      "\n" +

      "- Materials shown: " +
      c.materials +
      "\n" +

      "- Text tone: " +
      c.tone +
      "\n" +

      "- Viral hook angle: " +
      c.hook

    );

  }).join("\n\n");

}


/* =========================================================
   MUSIC BLOCK
   ========================================================= */

function buildMusicBlock(countries) {

  return countries.map(code => {

    return (
      countryLabels[code] +
      ": " +
      countryStyle[code].music
    );

  }).join("\n");

}


/* =========================================================
   GENERATE FINAL MASTER PROMPT
   ========================================================= */

    document.getElementById("topic")
      .value.trim();

  const hook =
    document.getElementById("hook")
      .value.trim();

  const ending =
    document.getElementById("ending")
      .value.trim();

  const checked =
    Array.from(
      document.querySelectorAll(
        ".country-cb:checked"
      )
    ).map(cb => cb.value);

  const errorEl =
    document.getElementById("error");


  if (!topic) {

    errorEl.textContent =
      "Enter or pick a craft action first.";

    errorEl.style.display =
      "block";

    return;

      "Select at least one target country.";

      "block";

    "none";

    checked
      .map(c => countryLabels[c])

    buildCountryBlock(checked);

    buildMusicBlock(checked);

    "maximum realistic organic follower growth, while optimizing watch time, retention, saves, shares, comments and follower conversion";

    "Wait... this is just paper? 🤯";

/* =========================================================
   COPY
   ========================================================= */

function copyPrompt() {

  const out =
    document.getElementById("output");

  out.select();
  out.setSelectionRange(
    0,
    999999
  );

  const btn =
    document.getElementById("copy-btn");

  const old =
    btn.textContent;


  const showCopied = () => {

    btn.textContent =
      "Copied ✓";

    setTimeout(() => {

      btn.textContent =
        old;

    }, 1500);

  };


  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard
      .writeText(out.value)
      .then(showCopied)
      .catch(() => {

        try {

          document.execCommand("copy");
          showCopied();

        } catch (e) {}

      });

  } else {

    try {

      document.execCommand("copy");
      showCopied();

    } catch (e) {}

  }

}
