<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Craftora DIY">
<meta name="theme-color" content="#3D5A45">

<title>Craftora DIY - Master Prompt Generator</title>

<style>
:root{
  --bg:#F2EEE4;
  --surface:#FFFFFF;
  --surface2:#FBF8F1;
  --ink:#3A2E27;
  --soft:#6B5D52;
  --muted:#9C8F82;
  --accent:#3D5A45;
  --accent2:#E4EBE2;
  --rose:#C77B76;
  --rose2:#F6E7E5;
  --border:#E2D9C9;
  --danger:#B5453D;
  --radius:12px;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:22px 15px 55px;
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  max-width:570px;
  margin:auto;
}

header{
  text-align:center;
  margin-bottom:22px;
}

.logo{
  width:68px;
  height:68px;
  margin:0 auto 9px;
  border-radius:20px;
  background:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  box-shadow:0 7px 18px rgba(61,90,69,.20);
}

header h1{
  margin:0;
  color:var(--accent);
  font-family:Georgia,serif;
  font-size:27px;
}

header p{
  margin:5px 0 0;
  color:var(--soft);
  font-size:12.5px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
  margin-bottom:13px;
}

.field-label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--soft);
  margin-bottom:7px;
}

input[type=text]{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--surface2);
  color:var(--ink);
  font-size:15px;
  outline:none;
}

input[type=text]:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(61,90,69,.10);
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.chip{
  border:0;
  border-radius:999px;
  padding:7px 11px;
  background:var(--rose2);
  color:#8A4A45;
  font-size:12px;
  cursor:pointer;
}

.country-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.country-item{
  border:1px solid var(--border);
  border-radius:11px;
  padding:9px 10px;
  background:var(--surface2);
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12.5px;
}

.country-item input{
  margin-right:5px;
}

.rpm{
  color:var(--muted);
  font-size:9.5px;
  text-transform:uppercase;
}

.switch-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.switch-text strong{
  display:block;
  font-size:14px;
  margin-bottom:3px;
}

.switch-text span{
  display:block;
  color:var(--soft);
  font-size:11.5px;
  line-height:1.4;
}

.switch{
  position:relative;
  width:50px;
  height:28px;
  flex:none;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#CFC7BA;
  border-radius:30px;
  cursor:pointer;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:.2s;
  box-shadow:0 2px 5px rgba(0,0,0,.18);
}

.switch input:checked + .slider{
  background:var(--accent);
}

.switch input:checked + .slider:before{
  transform:translateX(22px);
}

.generate{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:var(--accent);
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-top:4px;
}

.generate:active{
  transform:scale(.99);
}

.error{
  display:none;
  color:var(--danger);
  font-size:12.5px;
  margin:8px 3px;
}

.output{
  display:none;
  margin-top:14px;
}

.output-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.output-head span{
  font-size:13px;
  font-weight:600;
  color:var(--soft);
}

.copy{
  border:0;
  border-radius:999px;
  padding:6px 12px;
  background:var(--accent2);
  color:var(--accent);
  font-weight:600;
}

textarea{
  width:100%;
  min-height:560px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--surface2);
  padding:12px;
  resize:vertical;
  font-family:monospace;
  font-size:11px;
  line-height:1.5;
  color:var(--ink);
}

.footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="logo">✂️</div>
  <h1>Craftora DIY</h1>
  <p>Master Prompt Generator</p>
</header>

<div class="card">
  <label class="field-label">Trending DIY topics</label>

  <div class="chips">
    <button class="chip" onclick="pick('Dollar Tree Room Decor Hack')">Dollar Tree Hack</button>
    <button class="chip" onclick="pick('Thrift Flip Transformation')">Thrift Flip</button>
    <button class="chip" onclick="pick('Miniature Dollhouse Furniture')">Mini Furniture</button>
    <button class="chip" onclick="pick('Resin Coaster Art')">Resin Art</button>
    <button class="chip" onclick="pick('No-Sew Cozy Blanket')">No-Sew Blanket</button>
    <button class="chip" onclick="pick('Cardboard Storage Organizer')">Cardboard Organizer</button>
    <button class="chip" onclick="pick('Aesthetic Room Wall Art')">Room Wall Art</button>
    <button class="chip" onclick="pick('Paper Flower Bouquet')">Paper Flowers</button>
    <button class="chip" onclick="pick('Impossible Paper Fold')">Impossible Paper Fold</button>
  </div>
</div>

<div class="card">
  <label class="field-label">Thing to make / Craft action</label>
  <input id="topic" type="text"
    placeholder="Example: Impossible Paper Fold">
</div>

<div class="card">

  <div class="switch-row">

    <div class="switch-text">
      <strong>👩 Girl Intro</strong>
      <span>
        Add an attractive young-adult female creator in the opening.
        STEP-BY-STEP text remains mandatory.
      </span>
    </div>

    <label class="switch">
      <input id="girl" type="checkbox">
      <span class="slider"></span>
    </label>

  </div>

</div>

<div class="card">

<label class="field-label">Target countries — choose up to 4</label>

<div id="countries" class="country-grid"></div>

</div>

<div class="card">

<label class="field-label">Viral Hook — editable</label>

<input id="hook"
type="text"
placeholder='Example: "Wait until you see what this paper becomes..."'>

</div>

<div class="card">

<label class="field-label">Closing wording — editable</label>

<input id="closing"
type="text"
placeholder='Example: "Would you try this? YES or NO? 👇"'>

</div>

<button class="generate" onclick="generate()">
Generate Final Craftora Prompt
</button>

<div id="error" class="error"></div>

<div id="outputBox" class="card output">

<div class="output-head">
<span>Generated Master Prompt</span>
<button class="copy" onclick="copyPrompt()">Copy</button>
</div>

<textarea id="output" readonly></textarea>

</div>

<div class="footer">
Craftora DIY • Created for Hiraj
</div>

</div>

<script>

const countryStyle = {

US:{
label:"United States",
rpm:"highest",
aesthetic:"bright, bold, high-contrast but clean DIY aesthetic",
materials:"Walmart, Target, Michaels, Dollar Tree style materials",
tone:"casual, friendly natural American English",
hook:"budget-friendly satisfying DIY / dollar-store transformation",
music:"current royalty-free or officially licensed slow lo-fi pop with warm acoustic guitar, suitable for US short-form DIY content"
},

Canada:{
label:"Canada",
rpm:"high",
aesthetic:"bright, relaxed, cozy nature-inspired tones",
materials:"Dollarama, Michaels and commonly available craft materials",
tone:"warm, friendly Canadian-style English",
hook:"cozy, useful and satisfying weekend DIY project",
music:"current royalty-free or officially licensed slow indie-folk acoustic sound with cozy cabin atmosphere"
},

UK:{
label:"United Kingdom",
rpm:"high",
aesthetic:"refined, tidy, soft muted DIY palette",
materials:"The Range, B&M and commonly available craft materials",
tone:"natural, friendly British English",
hook:"smart, practical and satisfying home DIY",
music:"current royalty-free or officially licensed gentle piano-led lo-fi sound"
},

Australia:{
label:"Australia",
rpm:"high",
aesthetic:"light, airy, colourful and natural",
materials:"Kmart, Spotlight and commonly available craft materials",
tone:"relaxed, friendly Australian English",
hook:"easy weekend DIY transformation",
music:"current royalty-free or officially licensed relaxed acoustic lifestyle sound"
},

Germany:{
label:"Germany",
rpm:"high",
aesthetic:"precise, clean, modern natural tones",
materials:"Action and common local craft-store materials",
tone:"clear and straightforward English",
hook:"precise, practical, well-made DIY",
music:"current royalty-free or officially licensed minimal piano / ambient instrumental"
},

Switzerland:{
label:"Switzerland",
rpm:"high",
aesthetic:"precise, elegant, refined neutral tones",
materials:"commonly available craft and home-store materials",
tone:"clear, polished international English",
hook:"quality craftsmanship and satisfying precision",
music:"current royalty-free or officially licensed refined slow piano with subtle strings"
},

Norway:{
label:"Norway",
rpm:"high",
aesthetic:"minimal Nordic palette with clean white space",
materials:"commonly available Nordic home and craft materials",
tone:"calm, simple English",
hook:"minimalist cozy DIY",
music:"current royalty-free or officially licensed airy Nordic ambient-folk instrumental"
},

Sweden:{
label:"Sweden",
rpm:"high",
aesthetic:"clean Scandinavian minimalism with soft pastels",
materials:"IKEA-style and common craft-store materials",
tone:"simple, calm English",
hook:"cozy minimalist home DIY",
music:"current royalty-free or officially licensed Scandinavian lo-fi"
},

Denmark:{
label:"Denmark",
rpm:"high",
aesthetic:"warm minimalist Scandinavian design",
materials:"common Nordic home and craft materials",
tone:"friendly, calm English",
hook:"simple cozy hygge-style DIY",
music:"current royalty-free or officially licensed warm acoustic hygge instrumental"
},

Netherlands:{
label:"Netherlands",
rpm:"high",
aesthetic:"clean, bright, practical natural-light aesthetic",
materials:"Action, HEMA and common craft materials",
tone:"friendly direct English",
hook:"practical budget-friendly DIY",
music:"current royalty-free or officially licensed relaxed indie-pop instrumental"
},

Ireland:{
label:"Ireland",
rpm:"medium-high",
aesthetic:"warm, cozy and approachable",
materials:"Dealz, Woodies and common craft materials",
tone:"friendly natural English",
hook:"cozy home-project transformation",
music:"current royalty-free or officially licensed warm slow acoustic folk"
},

NewZealand:{
label:"New Zealand",
rpm:"medium-high",
aesthetic:"light, natural outdoor-inspired tones",
materials:"Kmart, The Warehouse and common craft materials",
tone:"relaxed friendly English",
hook:"easy weekend DIY project",
music:"current royalty-free or officially licensed relaxed acoustic lifestyle track"
},

Poland:{
label:"Poland",
rpm:"medium",
aesthetic:"clean cozy minimalist natural tones",
materials:"Pepco, Action, IKEA-style and common craft materials",
tone:"simple clear English",
hook:"cozy practical home-decor DIY",
music:"current royalty-free or officially licensed gentle piano and strings"
}

};

const countryContainer =
document.getElementById("countries");

Object.keys(countryStyle).forEach((code,index)=>{

const c=countryStyle[code];

const label=document.createElement("label");

label.className="country-item";

label.innerHTML=`
<span>
<input type="checkbox"
class="country"
value="${code}"
${index===0 ? "checked":""}>
${c.label}
</span>
<span class="rpm">${c.rpm}</span>
`;

countryContainer.appendChild(label);

});

function refreshCountries(){

const selected=
document.querySelectorAll(".country:checked");

document.querySelectorAll(".country").forEach(cb=>{

cb.disabled=
selected.length>=4 && !cb.checked;

});

}

document.querySelectorAll(".country").forEach(cb=>{

cb.addEventListener("change",refreshCountries);

});

refreshCountries();

function pick(value){

document.getElementById("topic").value=value;

}

function generate(){

const topic=
document.getElementById("topic").value.trim();

const hook=
document.getElementById("hook").value.trim();

const closing=
document.getElementById("closing").value.trim();

const girl=
document.getElementById("girl").checked;

const selected=
Array.from(
document.querySelectorAll(".country:checked")
).map(x=>x.value);

const error=
document.getElementById("error");

if(!topic){

error.textContent=
"Enter the craft topic first.";

error.style.display="block";

return;

}

if(selected.length===0){

error.textContent=
"Select at least one target country.";

error.style.display="block";

return;

}

error.style.display="none";

const names=
selected.map(x=>countryStyle[x].label).join(", ");

const countryBlock=
selected.map(code=>{

const c=countryStyle[code];

return `${c.label}:
- Aesthetic: ${c.aesthetic}
- Materials: ${c.materials}
- Text tone: ${c.tone}
- Viral hook angle: ${c.hook}`;

}).join("\n\n");

const musicBlock=
selected.map(code=>
`${countryStyle[code].label}: ${countryStyle[code].music}`
).join("\n");

const girlBlock=girl ? `

GIRL INTRO: ON

Include one attractive, realistic YOUNG ADULT female DIY creator in the opening.

The girl must visually demonstrate or present the finished craft naturally for a very short attention-grabbing intro.

IMPORTANT:
The girl intro MUST NOT replace the tutorial.
The girl intro MUST NOT remove, hide, replace or reduce the STEP-BY-STEP instructional text.

After the short opening, immediately transition into the actual craft tutorial.

If the girl speaks, her narration is secondary. The visual STEP numbers and written instructions remain mandatory and must be clearly visible on screen.

Do not make the girl dominate the entire video.
Do not turn the video into a talking-head video.
The craft remains the main subject.
` : `

GIRL INTRO: OFF

Do not include a human creator or talking presenter.
Start directly with the craft / transformation hook.
`;

const finalHook=
hook || "Wait until you see what this becomes...";

const finalClosing=
closing || "Would you try this? YES or NO? 👇";

const prompt=`

MASTER PROMPT — CRAFTORA DIY VIRAL DIY VIDEO
FINAL PRODUCTION VERSION
BRAND-CONSISTENT • MULTI-COUNTRY • STEP-BY-STEP LOCKED

Create a highly attractive, original, professional and viral-ready DIY craft video for my Facebook page:

CRAFTORA DIY

THING TO MAKE:
${topic}

TARGET COUNTRIES:
${names}

PRIMARY GOAL:
Maximize realistic organic reach, watch time, saves, shares, comments and follower conversion.

IMPORTANT:
No prompt can guarantee virality or a specific number of followers. Optimize every creative decision for the highest realistic organic performance.

--------------------------------------------------
CRAFTORA DIY PERMANENT BRAND IDENTITY
--------------------------------------------------

Craftora DIY must have a recognizable visual identity across EVERY video.

The brand identity must remain consistent regardless of topic or target country.

Use:

- warm handmade visual feeling
- soft pastel base colors
- one or two attractive bright accent colors
- clean light background
- premium DIY editorial appearance
- realistic materials
- natural soft shadows
- clean rounded sans-serif typography
- consistent text placement
- consistent step-number design
- consistent CTA placement
- consistent pacing
- consistent opening and closing branding

The viewer should be able to recognize that the video belongs to Craftora DIY even before reading the page name.

--------------------------------------------------
CRAFTORA DIY BRAND NAME
--------------------------------------------------

The exact brand name is:

Craftora DIY

Use EXACTLY this spelling.

Do not change it.

Do not abbreviate it.

Do not generate alternative names.

Do not generate a different logo or random brand name.

At the beginning of every video, display:

Craftora DIY

using the same elegant, minimal, recognizable text treatment every time.

The opening brand text should be small, premium and visually integrated rather than looking like a large advertisement.

At the end of every video, display:

Craftora DIY

using the SAME visual treatment.

Branding must never cover the craft or instructional text.

--------------------------------------------------
OPENING STRUCTURE
--------------------------------------------------

The first seconds must be extremely strong.

Opening priority:

1. Craftora DIY brand text appears briefly and elegantly.
2. Immediately show the most visually interesting aspect of the finished craft or transformation.
3. Use this hook:

"${finalHook}"

4. Create an immediate curiosity gap.
5. Transition quickly into the actual tutorial.

Do not waste the opening with long introductions.

--------------------------------------------------
GIRL INTRO CONTROL
--------------------------------------------------

${girlBlock}

--------------------------------------------------
CRITICAL STEP-BY-STEP TEXT REQUIREMENT
--------------------------------------------------

THIS IS MANDATORY.

Every actual crafting step MUST contain visible on-screen instructional text.

The girl introduction, narration, music, visual effects or voice-over MUST NEVER replace the written step instructions.

For every step:

STEP 1
[short clear instruction]

STEP 2
[short clear instruction]

STEP 3
[short clear instruction]

Continue until the craft is genuinely complete.

The step number and instruction must be visible long enough to be read comfortably on a mobile phone.

Never omit the step text.

Never rely only on narration.

Never make the viewer guess what action is being performed.

--------------------------------------------------
STEP-BY-STEP ACCURACY
--------------------------------------------------

Determine the correct number of steps automatically.

Prefer approximately 7–10 steps when appropriate, but use fewer or more if the craft genuinely requires it.

Every step must show the REAL physical action.

Examples:

- measuring
- cutting
- folding
- creasing
- rolling
- gluing
- joining
- shaping
- layering
- painting
- assembling
- decorating

Every step must logically follow the previous step.

No invented actions.

No impossible transformations.

No missing actions.

No skipped critical stage.

The final craft MUST actually be achievable by following the displayed instructions.

--------------------------------------------------
STEP TEXT DESIGN
--------------------------------------------------

Use short, natural English.

Each instruction should ideally be only a few words.

Example:

STEP 1
Fold the paper in half.

STEP 2
Crease the center firmly.

STEP 3
Fold both corners inward.

STEP 4
Open and reverse the fold.

STEP 5
Lock the two sections together.

Never use:

- long paragraphs
- fake words
- gibberish
- random letters
- distorted typography
- unnecessary technical language

Text must be sharp and readable.

--------------------------------------------------
TIMING AND PACING
--------------------------------------------------

The entire video must have deliberate timing.

Do not rush important instructions.

Do not leave dead air.

Use quick satisfying cuts for simple actions.

Give slightly more screen time to complicated actions.

Every step must remain visible long enough for the viewer to understand both:

1. the physical action
2. the written instruction

The final reveal should receive strong visual emphasis.

Suggested rhythm:

OPENING HOOK
→ SHORT GIRL INTRO IF ENABLED
→ STEP 1
→ STEP 2
→ STEP 3
→ STEP 4
→ STEP 5
→ CONTINUE AS REQUIRED
→ FINAL REVEAL
→ CLOSING QUESTION
→ CRAFTORA DIY BRAND

The exact number and duration of steps must adapt to the craft.

--------------------------------------------------
VIRAL WATCH-TIME OPTIMIZATION
--------------------------------------------------

Optimize for:

- scroll stopping
- curiosity
- completion rate
- rewatching
- saves
- shares
- comments
- follows

Use a strong SIMPLE MATERIAL → SATISFYING PROCESS → WOW RESULT story.

The final result should feel more impressive than the starting material.

Use visual transformations wherever possible.

Create a loop-friendly final frame that visually connects naturally with the opening.

--------------------------------------------------
SAVE OPTIMIZATION
--------------------------------------------------

Make the tutorial feel like a useful reference.

Step numbers must be clear.

Instructions must be easy to remember.

The finished craft must look achievable.

Encourage saving through the closing structure without becoming spammy.

--------------------------------------------------
COMMENT OPTIMIZATION
--------------------------------------------------

The closing wording is editable.

Use EXACTLY this closing wording:

"${finalClosing}"

Display it during the final approximately 2 seconds.

The question should encourage a simple response such as YES / NO, A / B, or a short choice.

Do not force engagement unnaturally.

--------------------------------------------------
COUNTRY TARGETING
--------------------------------------------------

Blend the selected countries into ONE cohesive creative direction.

Do NOT create separate versions inside the same video.

${countryBlock}

Choose overlapping characteristics that work naturally across all selected countries.

--------------------------------------------------
MUSIC
--------------------------------------------------

Music should play consistently throughout the video.

Use a current-feeling, slow-to-moderate tempo style appropriate to the selected countries.

Country music directions:

${musicBlock}

If multiple countries are selected, choose ONE cohesive music style that works across all selected countries.

Use only royalty-free or officially licensed audio.

Prefer Meta Sound Collection or another properly licensed source.

Do NOT use copyrighted commercial music.

Do NOT use aggressive or excessively fast music.

Music must support the craft instead of distracting from it.

--------------------------------------------------
VISUAL QUALITY
--------------------------------------------------

Generate the highest available quality.

Target:

8K Ultra-HD visual quality where supported,
otherwise maximum available resolution.

Use:

- ultra-sharp details
- realistic paper texture
- realistic material thickness
- crisp folding lines
- accurate cutting edges
- realistic glue points
- realistic hands
- natural skin texture
- professional lighting
- realistic shadows
- high dynamic range appearance
- premium commercial DIY photography
- extremely clean typography
- sharp step numbers
- mobile-readable text
- no compression artifacts
- no blur
- no pixelation
- no muddy details
- no oversharpening

The result should look professionally produced rather than obviously AI-generated.

--------------------------------------------------
VERTICAL FORMAT
--------------------------------------------------

Create a vertical social-media video composition suitable for Facebook Reels.

Prioritize:

9:16 vertical framing.

Keep all important text inside safe mobile viewing areas.

Never place important instructions directly against the edges.

--------------------------------------------------
CRAFT MATERIAL REALISM
--------------------------------------------------

Materials must look physically real.

Paper must have realistic fibers, thickness, folds and shadows.

Glue must behave realistically.

Hands must interact naturally with objects.

Do not allow objects to magically change shape between steps.

Maintain continuity of:

- paper
- colors
- materials
- object orientation
- hand positioning
- work surface
- lighting
- camera perspective

--------------------------------------------------
FINAL REVEAL
--------------------------------------------------

The completed craft must receive the strongest visual emphasis.

Show it beautifully from a clean attractive angle.

Make the viewer immediately understand what was created.

The final result should trigger:

"Wow, I want to make this."

--------------------------------------------------
FINAL CTA
--------------------------------------------------

Use the consistent Craftora DIY CTA style:

Follow for more DIY ideas

Save • Share • Follow

Keep the CTA elegant and small.

Do not cover the craft.

--------------------------------------------------
FINAL 2 SECONDS
--------------------------------------------------

Show:

"${finalClosing}"

alongside the consistent Craftora DIY CTA.

The final frame should also visually echo the opening frame where possible to encourage seamless replay.

--------------------------------------------------
QUALITY CONTROL — MANDATORY
--------------------------------------------------

Before finalizing, internally verify ALL of the following:

1. Is the craft physically achievable?
2. Does every step logically follow the previous step?
3. Is every required action actually shown?
4. Does every step have visible written instructional text?
5. Are STEP 1, STEP 2, STEP 3 etc. clearly readable?
6. Is the text visible long enough to read?
7. Did the girl introduction accidentally replace any step?
8. If Girl Intro is ON, is she a young adult and visually realistic?
9. If Girl Intro is OFF, is no presenter included?
10. Is the Craftora DIY name consistent?
11. Is the opening brand treatment consistent?
12. Is the ending brand treatment consistent?
13. Is the hook exactly based on the editable hook?
14. Is the closing wording exactly based on the editable closing?
15. Is the music appropriate for the selected countries?
16. Is the music properly licensed?
17. Are the hands anatomically correct?
18. Are materials realistic?
19. Are there any impossible transformations?
20. Is the final result visually impressive?
21. Is the video optimized for mobile viewing?
22. Is the final quality maximum available / 8K target?
23. Is there a strong opening curiosity gap?
24. Is the ending loop-friendly?
25. Does the whole video feel unmistakably like Craftora DIY?

If ANY requirement fails, correct it before finalizing.

--------------------------------------------------
NEGATIVE INSTRUCTIONS
--------------------------------------------------

Do NOT:

- copy existing Pinterest designs
- copy Instagram designs
- copy copyrighted artwork
- use random watermarks
- invent a different brand name
- change Craftora DIY branding
- remove step text
- replace step text with narration
- skip critical crafting actions
- invent impossible actions
- create duplicate steps
- create malformed hands
- create extra fingers
- distort paper
- distort materials
- use unreadable text
- use gibberish
- use random letters
- use excessive decorations
- cover instructions
- cover the craft
- use low-resolution visuals
- use blurry footage
- use excessive transitions
- use distracting effects
- make the girl dominate the tutorial
- let the girl intro replace the tutorial
- use copyrighted commercial music
- change the established Craftora DIY visual identity

--------------------------------------------------
FINAL PRODUCTION COMMAND
--------------------------------------------------

Create the final ORIGINAL Craftora DIY DIY video now.

The result must prioritize:

1. Strong scroll-stopping opening
2. Consistent Craftora DIY identity
3. Optional girl intro according to the ON/OFF setting
