<style>
  :root {
    --bg: #F2EEE4;
    --surface: #FFFFFF;
    --surface-2: #FBF8F1;
    --ink: #3A2E27;
    --ink-soft: #6B5D52;
    --ink-muted: #9C8F82;
    --accent: #3D5A45;
    --accent-soft: #E4EBE2;
    --rose: #C77B76;
    --rose-soft: #F6E7E5;
    --border: #E2D9C9;
    --danger: #B5453D;
    --radius: 10px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    padding: 24px 16px 60px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  .brand-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 10px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(58,46,39,0.08);
    overflow: hidden;
  }

  .brand-icon svg {
    width: 56px;
    height: 56px;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 27px;
    margin: 0 0 4px;
    color: var(--accent);
    letter-spacing: 0.2px;
  }

  header p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .creator {
    margin-top: 7px;
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 0.2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .note-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .note-row p {
    margin: 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  label.field-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
  }

  .chip {
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 999px;
    background: var(--rose-soft);
    color: #8A4A45;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }

  .chip:active {
    transform: scale(0.97);
  }

  input[type=text] {
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface-2);
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
  }

  input[type=text]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .hook-input {
    border-color: var(--rose);
    background: #FFF9F8;
  }

  .country-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .country-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    background: var(--surface-2);
  }

  .country-item input {
    margin-right: 6px;
  }

  .rpm-tag {
    font-size: 10.5px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .generate-btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    margin-top: 6px;
  }

  .generate-btn:active {
    transform: scale(0.99);
  }

  .error {
    color: var(--danger);
    font-size: 13px;
    margin: 8px 2px 0;
    display: none;
  }

  .output-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .output-head span {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .copy-btn {
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
  }

  textarea {
    width: 100%;
    min-height: 420px;
    padding: 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface-2);
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink);
    resize: vertical;
  }

  .footer-note {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-muted);
    margin-top: 20px;
  }

  .section-badge {
    display: inline-block;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  @media (max-width: 380px) {
    .country-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <header>

    <div class="brand-icon">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="112" fill="#F2EEE4"/>
        <circle cx="256" cy="256" r="178" fill="#E4EBE2"/>

        <path d="M256 175c-27-29-72-20-82 14-9 31 17 58 48 54 14-2 27-10 34-22 7 12 20 20 34 22 31 4 57-23 48-54-10-34-55-43-82-14z" fill="#C77B76"/>
        <path d="M205 321h102M216 344h80" stroke="#F2EEE4" stroke-width="12" stroke-linecap="round"/>
        <text x="256" y="420" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#3A2E27">CD</text>
      </svg>
    </div>

    <h1>Craftora DIY</h1>
    <p>Viral Craft Prompt Studio</p>
    <div class="creator">Created by Hiraj</div>

  </header>

  <div class="card">

    <label class="field-label">Trending topics in this niche</label>

    <div class="chips">

      <button class="chip" onclick="pickTopic('Dollar Tree Room Decor Hack')">
        Dollar Tree hack
      </button>

      <button class="chip" onclick="pickTopic('Thrift Flip Transformation')">
        Thrift flip
      </button>

      <button class="chip" onclick="pickTopic('Miniature Dollhouse Furniture')">
        Mini furniture
      </button>

      <button class="chip" onclick="pickTopic('Resin Coaster Art')">
        Resin art
      </button>

      <button class="chip" onclick="pickTopic('No-Sew Cozy Blanket')">
        No-sew blanket
      </button>

      <button class="chip" onclick="pickTopic('Cardboard Storage Organizer')">
        Cardboard organizer
      </button>

      <button class="chip" onclick="pickTopic('Aesthetic Room Wall Art')">
        Wall art
      </button>

      <button class="chip" onclick="pickTopic('Paper Flower Bouquet')">
        Paper flowers
      </button>

    </div>

  </div>

  <div class="card">

    <label class="field-label" for="topic">
      Craft action (thing to make)
    </label>

    <input
      id="topic"
      type="text"
      placeholder="Tap a topic above, or type your own idea"
    />

  </div>

  <!-- NEW: EDITABLE VIRAL HOOK -->

  <div class="card">

    <span class="section-badge">Viral Hook</span>

    <label class="field-label" for="hook">
      Opening hook for the video
    </label>

    <input
      id="hook"
      class="hook-input"
      type="text"
      placeholder="e.g. DON'T BUY WALL ART… TRY THIS FIRST 😳"
    />

  </div>

  <div class="card note-row">

    <span>📈</span>

    <p>
      Follower target set to maximum realistic organic growth automatically —
      no need to fill this in.
    </p>

  </div>

  <div class="card">

    <label class="field-label">
      Target countries, highest-earning first (pick up to 4)
    </label>

    <div id="country-list" class="country-grid"></div>

  </div>

  <div class="card">

    <label class="field-label" for="ending">
      Closing wording for the last 2 seconds
    </label>

    <input
      id="ending"
      type="text"
      placeholder="e.g. Would you try this? YES or NO? 👇"
    />

  </div>

  <button class="generate-btn" onclick="generate()">
    Generate full master prompt
  </button>

  <p id="error" class="error"></p>

  <div
    id="output-wrap"
    class="card"
    style="display:none; margin-top:14px;"
  >

    <div class="output-head">

      <span>Generated prompt</span>

      <button id="copy-btn" class="copy-btn" onclick="copyPrompt()">
        Copy
      </button>

    </div>

    <textarea id="output" readonly></textarea>

  </div>

  <p class="footer-note">
    Save this page to your home screen for quick access.
  </p>

</div>

<script>

const countryStyle = {

  US: {
    rpm: 'highest',
    aesthetic: 'bold, bright, high-contrast colors, energetic composition',
    materials: 'items easily found at Walmart, Target, Michaels, Dollar Tree',
    tone: 'casual, friendly American English',
    hook: 'budget-friendly dollar store hack angle',
    music: 'upbeat-but-slow lo-fi pop with a warm acoustic guitar loop, the kind of gentle trending sound used in US aesthetic transformation videos'
  },

  Canada: {
    rpm: 'high',
    aesthetic: 'bright but relaxed, nature-influenced tones',
    materials: 'items available at Dollarama or Michaels',
    tone: 'warm, friendly Canadian English',
    hook: 'cozy seasonal and outdoor-living angle',
    music: 'soft indie-folk acoustic track with a relaxed slow tempo, cozy cabin-aesthetic feel'
  },

  UK: {
    rpm: 'high',
    aesthetic: 'refined, muted palette, tidy composition',
    materials: 'items available at Wilko, The Range, or B&M',
    tone: 'polite British English',
    hook: 'practical, understated charm angle',
    music: 'gentle piano-led lo-fi track, slow and understated, matching a calm British aesthetic'
  },

  Australia: {
    rpm: 'high',
    aesthetic: 'light, airy, sun-bright palette',
    materials: 'items available at Kmart or Spotlight',
    tone: 'relaxed, upbeat Australian English',
    hook: 'laid-back weekend-project angle',
    music: 'laid-back slow acoustic strum with a beachy, relaxed island-pop feel'
  },

  Germany: {
    rpm: 'high',
    aesthetic: 'precise, clean, muted natural tones',
    materials: 'items available at Action or local craft stores',
    tone: 'clear, straightforward English',
    hook: 'practical, well-made quality angle',
    music: 'minimal ambient piano track, slow and precise, understated electronic pads'
  },

  Norway: {
    rpm: 'high',
    aesthetic: 'minimal, muted Nordic tones, lots of white space',
    materials: 'items available at local Nordic home-goods stores',
    tone: 'calm, simple English',
    hook: 'minimalist hygge-style angle',
    music: 'soft ambient Nordic-folk instrumental, very slow and airy'
  },

  Switzerland: {
    rpm: 'high',
    aesthetic: 'precise, refined, neutral tones',
    materials: 'items available at local craft or home stores',
    tone: 'clear, polished English',
    hook: 'quality-craftsmanship angle',
    music: 'refined slow piano instrumental with subtle strings'
  },

  Sweden: {
    rpm: 'high',
    aesthetic: 'clean Scandinavian minimalism, soft pastels',
    materials: 'items available at IKEA-style stores',
    tone: 'calm, simple English',
    hook: 'cozy minimalist hygge angle',
    music: 'soft Scandinavian lo-fi with gentle synth pads, slow and dreamy'
  },

  Denmark: {
    rpm: 'high',
    aesthetic: 'cozy minimalism, warm neutral tones',
    materials: 'items available at local Nordic home stores',
    tone: 'calm, warm English',
    hook: 'hygge home-comfort angle',
    music: 'warm acoustic hygge-style instrumental, slow and comforting'
  },

  Netherlands: {
    rpm: 'high',
    aesthetic: 'clean, practical, bright natural light',
    materials: 'items available at Action or HEMA',
    tone: 'friendly, direct English',
    hook: 'practical budget-decor angle',
    music: 'light, slow indie-pop instrumental with a friendly, upbeat-but-relaxed feel'
  },

  Ireland: {
    rpm: 'medium-high',
    aesthetic: 'warm, cozy, approachable tones',
    materials: 'items available at Dealz or Woodies',
    tone: 'friendly Irish English',
    hook: 'cozy home-project angle',
    music: 'warm slow acoustic guitar with a gentle folk feel'
  },

  NewZealand: {
    rpm: 'medium-high',
    aesthetic: 'light, natural, outdoor-influenced tones',
    materials: 'items available at Kmart or The Warehouse',
    tone: 'relaxed, upbeat English',
    hook: 'laid-back weekend-project angle',
    music: 'relaxed slow acoustic track with a natural, outdoorsy tone'
  },

  Poland: {
    rpm: 'medium',
    aesthetic: 'clean, cozy, minimalist, soft natural tones',
    materials: 'items available at Pepco, Action, or IKEA-style home stores',
    tone: 'simple clear English, warm and approachable',
    hook: 'cozy home-decor and seasonal hygge-style angle',
    music: 'gentle slow piano-and-strings instrumental, cozy and warm'
  }

};

const countryLabels = {
  US: 'United States',
  Canada: 'Canada',
  UK: 'United Kingdom',
  Australia: 'Australia',
  Germany: 'Germany',
  Norway: 'Norway',
  Switzerland: 'Switzerland',
  Sweden: 'Sweden',
  Denmark: 'Denmark',
  Netherlands: 'Netherlands',
  Ireland: 'Ireland',
  NewZealand: 'New Zealand',
  Poland: 'Poland'
};

const MAX_COUNTRIES = 4;

const listEl = document.getElementById('country-list');

Object.keys(countryStyle).forEach((code, i) => {

  const label = document.createElement('label');

  label.className = 'country-item';

  label.innerHTML =
    '<span>' +
    '<input type="checkbox" value="' +
    code +
    '" class="country-cb"' +
    (i === 0 ? ' checked' : '') +
    ' />' +
    countryLabels[code] +
    '</span>' +
    '<span class="rpm-tag">' +
    countryStyle[code].rpm +
    '</span>';

  listEl.appendChild(label);

});

function refreshCbLimits() {

  const checked =
    document.querySelectorAll('.country-cb:checked');

  document.querySelectorAll('.country-cb').forEach(box => {

    box.disabled =
      checked.length >= MAX_COUNTRIES &&
      !box.checked;

  });

}

document.querySelectorAll('.country-cb').forEach(cb => {

  cb.addEventListener('change', () => {

    refreshCbLimits();

    document.getElementById('error').style.display = 'none';

  });

});

refreshCbLimits();

function pickTopic(t) {

  document.getElementById('topic').value = t;

  document.getElementById('error').style.display = 'none';

}

function buildCountryBlock(countries) {

  return countries.map(code => {

    const c = countryStyle[code];

    return countryLabels[code] +
      ' (RPM: ' +
      c.rpm +
      '):\n' +

      '- Aesthetic: ' +
      c.aesthetic +
      '\n' +

      '- Materials shown: ' +
      c.materials +
      '\n' +

      '- Text tone: ' +
      c.tone +
      '\n' +

      '- Viral hook angle: ' +
      c.hook;

  }).join('\n\n');

}

function buildMusicBlock(countries) {

  return countries.map(code => {

    return countryLabels[code] +
      ': ' +
      countryStyle[code].music;

  }).join('\n');

}

function generate() {

  const topic =
    document.getElementById('topic').value.trim();

  const hook =
    document.getElementById('hook').value.trim();

  const ending =
    document.getElementById('ending').value.trim();

  const checked =
    Array.from(
      document.querySelectorAll('.country-cb:checked')
    ).map(cb => cb.value);

  const errorEl =
    document.getElementById('error');

  if (!topic) {

    errorEl.textContent =
      'Enter or pick a craft action first.';

    errorEl.style.display = 'block';

    return;

  }

  if (!hook) {

    errorEl.textContent =
      'Enter your viral hook first.';

    errorEl.style.display = 'block';

    return;

  }

  if (checked.length === 0) {

    errorEl.textContent =
      'Select at least one target country.';

    errorEl.style.display = 'block';

    return;

  }

  errorEl.style.display = 'none';

  const countryLabel =
    checked
      .map(c => countryLabels[c])
      .join(', ');

  const countryBlock =
    buildCountryBlock(checked);

  const musicBlock =
    buildMusicBlock(checked);

  const followerLine =
    'maximum realistic organic follower growth (push for the highest achievable growth rate, not a capped number)';

  const text = [

    'MASTER PROMPT - CRAFTORA DIY VIRAL CRAFT VIDEO / INFOGRAPHIC',

    '(Brand-Consistent, Multi-Country, Music-Matched Edition)',

    '',

    'Create a highly attractive, original, viral-ready DIY craft tutorial for my Facebook page Craftora DIY.',

    '',

    '-------------------------------------------------',
    'VARIABLES FOR THIS GENERATION',
    '-------------------------------------------------',

    '',

    'THING TO MAKE: ' + topic,

    'TARGET COUNTRIES: ' + countryLabel,

    'PAGE FOLLOWER TARGET: ' + followerLine,

    'EDITABLE VIRAL HOOK: ' + hook,

    '',

    'Blend the visual and tonal cues of all listed countries into one cohesive design rather than making separate versions.',

    '',

    '-------------------------------------------------',
    'CRAFTORA DIY FIXED VIDEO BRAND IDENTITY',
    '-------------------------------------------------',

    '',

    'Every video must begin with the exact same Craftora DIY text branding.',

    'OPENING BRAND TEXT: CRAFTORA DIY',

    'The opening brand identity is TEXT ONLY. Do NOT use a logo.',

    'The exact wording "CRAFTORA DIY" must remain unchanged in every video.',

    'Use the same elegant rounded sans-serif typography, same font weight, same approximate size, same placement, same animation, same visual treatment, same spacing and same timing in every video.',

    'The Craftora DIY opening must become a recognizable visual signature across the entire page.',

    'Do not redesign, restyle, recolor or reposition the Craftora DIY opening based on the topic or target country.',

    'Do not replace Craftora DIY with another name.',

    'Do not add the creator name Hiraj to the video.',

    '',

    '-------------------------------------------------',
    'CRAFTORA DIY BRAND STYLE CONSISTENCY',
    '-------------------------------------------------',

    '',

    'Every single video generated for this page, regardless of topic or target country, must feel instantly recognizable as a Craftora DIY video.',

    '- Same warm, handmade color family across every video (soft pastels plus one or two bright accent colors), never a completely different palette from video to video.',

    '- Same pacing rhythm: quick satisfying cuts on each crafting action, no dead air, no overly long static shots.',

    '- Same on-screen text style: clean rounded sans-serif captions, consistent size and placement across every video.',

    '- Same tone of voice in captions: friendly, encouraging, and simple, never overly formal or overly silly.',

    '- Same closing structure every time: finished craft shown clearly, then the Follow-Share-Save CTA in the same position and style.',

    '- Treat this as a recognizable series so that a viewer who has seen one Craftora DIY video can immediately tell a new one belongs to the same page, purely from the look and feel, even before seeing the logo or name.',

    '',

    '-------------------------------------------------',
    'EXACT VIDEO TIMING STRUCTURE',
    '-------------------------------------------------',

    '',

    '0.0-0.8 seconds: Show the fixed "CRAFTORA DIY" text-only brand identity.',

    'The Craftora DIY branding must use the exact same visual treatment in every video.',

    '0.8-2.5 seconds: Immediately transition into the editable viral hook and the strongest curiosity-driving visual.',

    'VIRAL HOOK TO USE EXACTLY: "' + hook + '"',

    'Do not rewrite, replace or weaken the supplied viral hook unless absolutely necessary for grammatical correctness.',

    '2.5 seconds onward: Begin the actual step-by-step crafting process.',

    'The crafting process must have enough screen time for every physical action and instruction to be clearly understood.',

    'Do not sacrifice step clarity merely to make the video shorter.',

    'Final approximately 2 seconds: Show the completed craft clearly, then display the supplied closing wording together with the consistent Craftora DIY CTA.',

    'The ending should visually echo the opening or final reveal where possible to encourage seamless looping.',

    '',

    '-------------------------------------------------',
    'AUDIO / MUSIC',
    '-------------------------------------------------',

    '',

    'Use a slow-tempo, currently trending style of background music suited to the selected target countries, playing consistently through the entire video from start to finish.',

    musicBlock,

    '',

    'If multiple countries are selected, choose one cohesive track style that blends well across all of them, staying slow-tempo and aesthetic rather than fast or overly energetic.',

    'Use only royalty-free or officially licensed audio, such as music available through the Meta Sound Collection or another properly licensed source.',

    'Do not use copyrighted commercial music without the appropriate rights.',

    '',

    '-------------------------------------------------',
    'GROWTH TARGET',
    '-------------------------------------------------',

    '',

    'This post is one part of a consistent series working toward ' + followerLine + '.',

    'Optimize the content for strong watch time, replays, saves, shares, comments and genuine follower conversion.',

    'Never sacrifice tutorial clarity merely to chase a viral effect.',

    '',

    '-------------------------------------------------',
    'COUNTRY TARGETING NOTES',
    '-------------------------------------------------',

    '',

    countryBlock,

    '',

    'Favor the aesthetic and materials that overlap best across all selected countries, keeping the caption tone approachable to a general English-speaking audience.',

    '',

    '-------------------------------------------------',
    'GROWTH AND WATCH-TIME OPTIMIZATION LAYER',
    '-------------------------------------------------',

    '',

    '1. First-frame rule: after the fixed Craftora DIY opening, immediately show the strongest visual or transformation moment paired with the supplied viral hook.',

    '2. Curiosity gap: the hook should create a reason to continue watching without revealing the entire transformation immediately.',

function copyPrompt() {

  const out =
    document.getElementById('output');

  out.select();

  out.setSelectionRange(0, 999999);

  const btn =
    document.getElementById('copy-btn');

  const old =
    btn.textContent;

  const showCopied = () => {

    btn.textContent = 'Copied';

    setTimeout(() => {

      btn.textContent = old;

    }, 1500);

  };

  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard
      .writeText(out.value)
      .then(showCopied)
      .catch(() => {

        try {

          document.execCommand('copy');

          showCopied();

        } catch (e) {}

      });

  } else {

    try {

      document.execCommand('copy');

      showCopied();

    } catch (e) {}

  }

}
