<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Craftora Pro">
<meta name="theme-color" content="#050505">

<title>Craftora DIY - Ultra Pro Analyzer</title>

<style>
/* 100% English Pro-Level UI Styling */
:root {
  --bg-gradient: linear-gradient(145deg, #050505 0%, #111115 100%);
  --surface: rgba(24, 24, 27, 0.65); 
  --surface2: rgba(39, 39, 42, 0.8);
  --text-main: #FAFAFA;
  --text-muted: #A1A1AA;
  --accent: #3B82F6;
  --accent-glow: rgba(59, 130, 246, 0.35);
  --accent-gradient: linear-gradient(135deg, #1D4ED8 0%, #3B82F6 100%);
  --success: #10B981; 
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(59, 130, 246, 0.5);
  --radius: 12px;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #050505;
  background-image: var(--bg-gradient);
  color: var(--text-main);
  font-family: var(--font-sans);
  padding: 15px 15px 60px;
  -webkit-tap-highlight-color: transparent;
  line-height: 1.5;
  min-height: 100vh;
}

.wrap { max-width: 620px; margin: auto; }

/* Top Creator Badge */
.creator-badge {
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 20px;
  opacity: 0.7;
}
.creator-badge span {
  color: var(--accent);
}

header { text-align: center; margin-bottom: 30px; }

.logo {
  width: 64px; height: 64px;
  margin: 0 auto 16px;
  border-radius: 18px;
  background: var(--accent-gradient);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  box-shadow: 0 8px 25px var(--accent-glow);
  position: relative;
}

.logo::after {
  content: ''; position: absolute; inset: -2px; border-radius: 20px;
  background: var(--accent-gradient); z-index: -1; opacity: 0.5; filter: blur(10px);
}

header h1 { margin: 0; font-weight: 800; font-size: 26px; letter-spacing: -0.5px; }
header p { margin: 6px 0 0; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.field-label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.8px;
}

.pro-badge {
  background: rgba(59, 130, 246, 0.15);
  color: var(--accent);
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1px;
}

input[type=text] {
  width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: rgba(0,0,0,0.4); color: var(--text-main); font-size: 14px; outline: none; transition: 0.3s;
}
input[type=text]:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
input[type=text]::placeholder { color: var(--text-muted); font-weight: 400; }

/* Scrollable Trends */
.scroll-container {
  display: flex; overflow-x: auto; gap: 10px; padding-bottom: 12px; scrollbar-width: none; 
}
.scroll-container::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto;
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
  background: rgba(0,0,0,0.3); color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.3s;
}
.chip:hover { background: var(--surface2); color: var(--text-main); border-color: var(--accent); }
.chip.viral-chip { background: rgba(59, 130, 246, 0.08); border-color: rgba(59, 130, 246, 0.3); color: #93C5FD; }
.chip.viral-chip:hover { background: rgba(59, 130, 246, 0.2); color: #FFF; }

/* Segments */
.segment-group { display: flex; background: rgba(0,0,0,0.4); border-radius: 10px; padding: 4px; border: 1px solid var(--border); margin-bottom: 18px; }
.segment-btn { flex: 1; text-align: center; padding: 10px; border-radius: 8px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; font-size: 12px; cursor: pointer; transition: 0.3s; }
.segment-btn.active { background: var(--surface2); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

/* Buttons */
.btn-group { display: flex; gap: 12px; margin-top: 24px; }
.btn-main { flex: 1; border: none; border-radius: 10px; padding: 16px; background: var(--accent-gradient); color: white; font-size: 13px; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px var(--accent-glow); }
.btn-main:active { transform: scale(0.98); }
.btn-main:disabled { background: var(--surface2); color: var(--text-muted); cursor: not-allowed; box-shadow: none; }
.btn-clear { width: 55px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); border-radius: 10px; color: var(--text-muted); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
.btn-clear:hover { background: var(--surface2); color: var(--text-main); }

/* Loading & Progress */
.loading-area { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px 20px; text-align: center; margin-top: 20px; backdrop-filter: blur(12px); }
.loading-text { font-weight: 600; color: var(--text-main); margin-bottom: 16px; font-size: 13px; letter-spacing: 0.5px; }
.progress-bg { width: 100%; height: 6px; background: rgba(0,0,0,0.5); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; width: 0%; background: var(--accent-gradient); border-radius: 99px; transition: width 0.1s linear; box-shadow: 0 0 10px var(--accent-glow); }

/* Analysis Results */
.analysis-box { background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.2); border-left: 4px solid var(--success); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; display: none; backdrop-filter: blur(12px); }
.analysis-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.rating { font-size: 24px; font-weight: 800; color: var(--success); text-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
.analysis-text { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 15px; }
.hashtags-area { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; color: #6EE7B7; background: rgba(0,0,0,0.4); border: 1px solid rgba(16, 185, 129, 0.1); padding: 14px; border-radius: 8px; word-wrap: break-word; line-height: 1.5; }

/* Prompt Output */
.output { display: none; }
.output-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.output-head span { font-size: 13px; font-weight: 700; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; }
.copy { border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; background: rgba(0,0,0,0.4); color: var(--text-main); font-weight: 600; font-size: 11px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
.copy:hover { background: var(--surface2); border-color: var(--accent); }
textarea { width: 100%; min-height: 650px; border: 1px solid var(--border); border-radius: 10px; background: rgba(0,0,0,0.5); padding: 18px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.6; color: #D4D4D8; }
textarea:focus { outline: none; border-color: var(--border-focus); color: #FFF; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

.footer { text-align: center; color: var(--text-muted); font-size: 10px; margin-top: 40px; font-weight: 600; opacity: 0.4; letter-spacing: 1px; }
</style>
</head>

<body>

<div class="wrap">

<div class="creator-badge">Created by <span>Hiraj</span></div>

<header>
  <div class="logo">✦</div>
  <h1>Craftora Pro</h1>
  <p>Ultimate US Viral Engine</p>
</header>

<div class="card">
  <label class="field-label">Target Platform <span class="pro-badge">ALGORITHM SYNC</span></label>
  <div class="segment-group" id="platformSegment">
    <button class="segment-btn active" onclick="setPlatform('Facebook Reels', this)">Facebook</button>
    <button class="segment-btn" onclick="setPlatform('TikTok', this)">TikTok</button>
    <button class="segment-btn" onclick="setPlatform('Instagram', this)">Instagram</button>
    <button class="segment-btn" onclick="setPlatform('YouTube Shorts', this)">YouTube</button>
  </div>
</div>

<div class="card">
  <label class="field-label">Current US Trending Topics (Scroll) <span class="pro-badge">UPDATED</span></label>
  <div class="scroll-container">
    <button class="chip viral-chip" onclick="pickTopic('Renter-Friendly Faux Brick Wall', 'My landlord thought I ruined the wall, but...')">1. Renter Brick Wall</button>
    <button class="chip viral-chip" onclick="pickTopic('Textured Arch Canvas Art', 'Make $800 gallery art using drywall mud...')">2. Textured Arch Art</button>
    <button class="chip viral-chip" onclick="pickTopic('Smart-Mirror IKEA Hack', 'I turned a basic IKEA mirror into a smart display...')">3. Smart IKEA Mirror</button>
    <button class="chip viral-chip" onclick="pickTopic('Bio-Resin Eco Coasters', 'The most satisfying zero-waste resin pour...')">4. Eco Resin Coasters</button>
    <button class="chip viral-chip" onclick="pickTopic('Invisible Floating Bed DIY', 'How we built a floating bed that went viral...')">5. Floating Bed DIY</button>
    <button class="chip viral-chip" onclick="pickTopic('Secret Hidden Bookshelf Door', 'Wait until you see what is behind this shelf...')">6. Hidden Room Door</button>
    <button class="chip viral-chip" onclick="pickTopic('Thrifted Lamp Plaster Upcycle', 'I turned a $3 ugly lamp into luxury decor...')">7. Plaster Lamp Upcycle</button>
    <button class="chip viral-chip" onclick="pickTopic('Dollar Tree Luxury Wall Sconce', 'I regret not making these sconces sooner...')">8. Luxury Wall Sconce</button>
    <button class="chip viral-chip" onclick="pickTopic('Magnetic Cardboard Organizer', 'Stop throwing away your Amazon boxes...')">9. Magnetic Organizer</button>
    <button class="chip viral-chip" onclick="pickTopic('AI-Responsive LED Wall Art', 'This DIY LED art reacts to my voice...')">10. LED Smart Art</button>
  </div>
</div>

<div class="card">
  <label class="field-label">1. Core Craft Topic</label>
  <input id="topic" type="text" placeholder="e.g. Renter-Friendly Faux Brick Wall">
</div>

<div class="card">
  <label class="field-label">2. Creator & Environment</label>
  <div class="segment-group" id="genderSegment" style="margin-bottom: 12px;">
    <button class="segment-btn active" onclick="setGender('Female', this)">US Female</button>
    <button class="segment-btn" onclick="setGender('Male', this)">US Male</button>
  </div>
  <div class="segment-group" id="envSegment">
    <button class="segment-btn active" onclick="setEnv('Indoor', this)">Aesthetic Indoor</button>
    <button class="segment-btn" onclick="setEnv('Outdoor', this)">Natural Outdoor</button>
  </div>
</div>

<div class="card">
  <label class="field-label">3. Hooks & Engagement <span class="pro-badge">PSYCHOLOGICAL</span></label>
  <input id="hook" type="text" placeholder='Text Hook: "My landlord thought I ruined the wall, but..."' style="margin-bottom: 12px;">
  <input id="closing" type="text" placeholder='Closing: "Would you make this? Yes or No? 👇"'>
</div>

<div class="btn-group">
  <button id="analyzeBtn" class="btn-main" onclick="startAnalysis()">
    Analyze & Generate Master Prompt
  </button>
  <button class="btn-clear" onclick="clearAll()" title="Reset">↺</button>
</div>

<div id="loader" class="loading-area">
  <div id="loaderText" class="loading-text">Analyzing Trend Patterns...</div>
  <div class="progress-bg"><div id="progressBar" class="progress-fill"></div></div>
</div>

<div id="analysisOutput" class="analysis-box">
  <div class="analysis-header">
    <div><span class="field-label" style="margin:0;">Originality & Viral Score</span></div>
    <div id="ratingScore" class="rating">10/10</div>
  </div>
  <div id="analysisText" class="analysis-text"></div>
  <div class="field-label">Optimized Caption & Tags</div>
  <div id="hashtagsArea" class="hashtags-area"></div>
</div>

<div id="outputBox" class="card output">
  <div class="output-head">
    <span>Master Video Generation Prompt</span>
    <button class="copy" onclick="copyPrompt()">Copy Prompt</button>
  </div>
  <textarea id="output" readonly></textarea>
</div>

<div class="footer">ENGINE BUILD 2026 • KATANA AI MARKETING</div>

</div>

<script>
let currentPlatform = 'Facebook Reels';
let currentGender = 'Female';
let currentEnv = 'Indoor';
let progress = 0;

function setPlatform(platform, btn) {
  currentPlatform = platform;
  const btns = document.getElementById('platformSegment').children;
  for (let b of btns) b.classList.remove('active');
  btn.classList.add('active');
}

function setGender(gender, btn) {
  currentGender = gender;
  const btns = document.getElementById('genderSegment').children;
  for (let b of btns) b.classList.remove('active');
  btn.classList.add('active');
}

function setEnv(env, btn) {
  currentEnv = env;
  const btns = document.getElementById('envSegment').children;
  for (let b of btns) b.classList.remove('active');
  btn.classList.add('active');
}

function pickTopic(topic, suggestedHook) {
  document.getElementById("topic").value = topic;
  document.getElementById("hook").value = suggestedHook;
  document.getElementById("closing").value = "Would you try making this? Let me know! 👇";
}

function clearAll() {
  document.getElementById("topic").value = "";
  document.getElementById("hook").value = "";
  document.getElementById("closing").value = "";
  document.getElementById("loader").style.display = "none";
  document.getElementById("analysisOutput").style.display = "none";
  document.getElementById("outputBox").style.display = "none";
  document.getElementById("analyzeBtn").disabled = false;
  document.getElementById("analyzeBtn").innerHTML = "Analyze & Generate Master Prompt";
  progress = 0;
  document.getElementById("progressBar").style.width = "0%";
}

function startAnalysis() {
  const topic = document.getElementById("topic").value.trim();
  if(!topic) { alert("Please enter a core craft topic first."); return; }

  document.getElementById("analyzeBtn").disabled = true;
  document.getElementById("analyzeBtn").innerHTML = "Processing Engine...";
  document.getElementById("loader").style.display = "block";
  document.getElementById("analysisOutput").style.display = "none";
  document.getElementById("outputBox").style.display = "none";
  
  progress = 0;
  const loaderText = document.getElementById("loaderText");
  const progressBar = document.getElementById("progressBar");
  
  const loadingMessages = [
    `Analyzing ${currentPlatform} 3-Second Retention Patterns...`,
    "Applying Anti-Watermark & Cinematic Quality Filters...",
    "Configuring Bottom-Right Aesthetic Watermark...",
    "Enforcing Strict 100% Facial Identity Constraints...",
    "Finalizing Master Generation Prompt..."
  ];

  let messageIndex = 0;
  const loadingInterval = setInterval(() => {
    progress += 2;
    progressBar.style.width = progress + "%";
    
    if(progress % 20 === 0 && messageIndex < loadingMessages.length) {
      loaderText.innerText = loadingMessages[messageIndex];
      messageIndex++;
    }

    if(progress >= 100) {
      clearInterval(loadingInterval);
      finishAnalysis(topic);
    }
  }, 100);
}

function getPlatformRules(platform) {
  if (platform === 'Facebook Reels') return "Moderate pacing. Focus on 'Value/Budget Hack' aesthetic. High contrast text.";
  if (platform === 'TikTok') return "Extremely fast pacing. Focus on ASMR textures and rapid satisfying cuts.";
  if (platform === 'Instagram') return "Smooth pacing. Focus on high-end premium aesthetics, minimalism, and lifestyle lighting.";
  if (platform === 'YouTube Shorts') return "High-energy pacing. Center action. Focus on instant gratification and loops.";
  return "Standard viral pacing.";
}

function finishAnalysis(topic) {
  const hook = document.getElementById("hook").value.trim() || "Wait until you see what this becomes...";
  const closing = document.getElementById("closing").value.trim() || "Would you make this? Let me know! 👇";
  
  const analysisText = `Analysis Complete. Engineered for maximum psychological retention in the US market. Strict "NO FAKE UI" constraints applied to guarantee original cinematic footage. Added custom elegant "Craftora DIY" watermark styling for the bottom-right corner. Face consistency memory activated.`;
  
  const tags = `#CraftoraDIY #${topic.replace(/\s+/g, '')} #DIYProjects #USACrafts #${currentPlatform.replace(/\s+/g, '')}`;
  const previewCaption = `${hook} 😍 The final result is absolutely stunning!\n\nWould you try making this? Let me know in the comments! 👇\n\n${tags}`;

  const envContext = currentEnv === 'Indoor' 
    ? "Aesthetic indoor setting: clean modern US living room or cozy premium craft studio. Natural window lighting, cinematic soft shadows." 
    : "Aesthetic outdoor setting: beautiful US backyard. Cinematic natural sunlight, crisp outdoor colors, realistic bokeh depth of field.";

  const prompt = `
[SYSTEM OVERRIDE: 100% ORIGINAL CONTENT & VIRAL ENGAGEMENT]
TARGET PLATFORM: ${currentPlatform} (US Audience)
BRAND: Craftora DIY

Generate a 10/10 viral video concept, visual script, and perfectly optimized caption.

==================================================
🚫 CRITICAL ORIGINALITY RULE (ANTI-FAKE UI) 🚫
The generated video MUST look like 100% original, raw cinematic camera footage.
- ABSOLUTELY NO watermarks, logos, or text from other apps (No TikTok/IG/FB icons).
- NO fake user interfaces, NO floating hearts, NO comment icons, NO profile pictures, NO fake usernames on the screen.
- Clean, raw, cinematic footage only. 
==================================================

==================================================
🚨 CRITICAL FACIAL IDENTITY RULE (ABSOLUTE MANDATORY) 🚨
Whenever generating the Creator (${currentGender}), you MUST use the SAVED REFERENCE IMAGE (from 2026-04-25) as the sole, permanent, and authoritative facial identity. 
- The face must NEVER be altered, replaced, stylized beyond recognition, or substituted. 
- Maintain exact facial structure and proportions. 
- If unclear, reconstruct accurately using the reference image.
- Every output must appear as a different photograph of the exact same real person.
==================================================

==================================================
🏷️ PREMIUM BRAND WATERMARK 🏷️
- Text: "Craftora DIY"
- Placement: STRICTLY in the bottom-right corner of the video frame.
- Style: Use a beautiful, elegant, small, and unique aesthetic font.
- Visibility: It must look like a premium, subtle creator watermark that blends naturally into the video without being distracting.
==================================================

==================================================
🎥 ULTRA-REALISM & QUALITY (ANTI-AI LOOK) 🎥
- Resolution & Style: 4K/8K resolution, RAW photography style.
- Imperfections: 100% indistinguishable from reality. Include natural skin texture, realistic shadows, and accurate physics.
- Restrictions: NO plastic AI skin, NO morphing, NO extra fingers, NO floating objects.
==================================================

==================================================
🧠 PSYCHOLOGICAL 3-SECOND HOOK 🧠
- The first 3 seconds must act as a severe "Pattern Interrupt" to stop scrolling behavior instantly. 
- Show the most impossible, satisfying, or beautiful part of the transformation IMMEDIATELY.
==================================================

==================================================
📐 TEXT PLACEMENT & NON-DISTRACTING UI 📐
- Safe Zones: Place ALL step-by-step instructional text and hooks STRICTLY in the TOP or BOTTOM 15% safe zones.
- Center Visibility: NEVER obscure the main craft or creator in the center of the screen.
==================================================

CORE TOPIC: ${topic}
CREATOR: US ${currentGender}, casual stylish attire.
ENVIRONMENT: ${envContext}
PLATFORM ALGORITHM FOCUS: ${getPlatformRules(currentPlatform)}

--------------------------------------------------
VISUAL SCRIPT STRUCTURE
--------------------------------------------------
[0:00-0:03] THE 3-SECOND HOOK: High-quality final result shot. Hook Text (TOP safe zone): "${hook}"
[0:03-0:06] STEP 1: Introduce materials. Text (BOTTOM safe zone): "STEP 1: [Action]"
[0:06-0:15] STEPS 2-5: Satisfying process. Clear text (BOTTOM), center clear.
[0:15-0:18] THE REVEAL: Beautiful styled shot in the ${currentEnv}.
[0:18-0:20] OUTRO: Text "${closing}" (TOP or BOTTOM safe zone).
[ALWAYS ON]: The elegant "Craftora DIY" watermark in the bottom-right corner.

--------------------------------------------------
CAPTION & HASHTAGS
--------------------------------------------------
Generate a platform-optimized caption based on the craft topic. Include 1-2 opening sentences, an engaging question, and highly targeted viral hashtags.
`;

  document.getElementById("loader").style.display = "none";
  document.getElementById("analysisText").innerText = analysisText;
  document.getElementById("hashtagsArea").innerText = previewCaption;
  document.getElementById("analysisOutput").style.display = "block";
  
  document.getElementById("output").value = prompt.trim();
  document.getElementById("outputBox").style.display = "block";
  document.getElementById("analyzeBtn").disabled = false;
  document.getElementById("analyzeBtn").innerHTML = "Re-Analyze Content";
  
  document.getElementById("outputBox").scrollIntoView({ behavior:"smooth", block:"start" });
}

function copyPrompt() {
  const text = document.getElementById("output");
  text.select(); text.setSelectionRange(0, 999999);
  navigator.clipboard ? navigator.clipboard.writeText(text.value) : document.execCommand("copy");
  
  const btn = document.querySelector(".copy");
  const old = btn.innerHTML;
  btn.innerHTML = "Copied ✓";
  setTimeout(() => { btn.innerHTML = old; }, 2000);
}
</script>

</body>
</html>
